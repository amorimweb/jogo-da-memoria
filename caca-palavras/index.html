<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Caça-Palavras 🔍</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root{
    --panel:#ffffffee;
    --text:#2d2d4d;
    --accent:#6c5ce7;
    --accent2:#fdcb6e;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Comic Sans MS', 'Trebuchet MS', Arial, sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 40%,#f6d365 80%,#fda085 100%);
    background-size:400% 400%;
    animation:bgMove 18s ease infinite;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .back-link{
    align-self:flex-start;
    color:#fff;
    font-weight:bold;
    text-decoration:none;
    text-shadow:1px 1px 3px rgba(0,0,0,0.25);
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(26px,6vw,42px);
    text-align:center;
    color:#fff;
    text-shadow:3px 3px 0 var(--accent), -1px -1px 0 #fff2;
    margin:10px 0 4px;
  }
  .subtitle{
    text-align:center;
    color:#fff;
    font-weight:bold;
    text-shadow:1px 1px 3px rgba(0,0,0,0.25);
    margin-bottom:16px;
  }
  .screen{
    width:100%;
    max-width:900px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .screen.active{display:flex;}
  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    width:100%;
  }

  button{
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    padding:12px 22px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),#a29bfe);
    box-shadow:0 6px 0 #4834a8, 0 10px 18px rgba(0,0,0,0.2);
    transition:transform .08s;
  }
  button:active{transform:translateY(4px); box-shadow:0 2px 0 #4834a8;}
  button.secondary{
    background:linear-gradient(135deg,var(--accent2),#ffeaa7);
    color:#7a5c00;
    box-shadow:0 6px 0 #c99a00, 0 10px 18px rgba(0,0,0,0.2);
  }
  button.secondary:active{box-shadow:0 2px 0 #c99a00;}
  button:disabled{opacity:.5; cursor:not-allowed; box-shadow:none;}

  /* setup */
  .setup-form{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:14px;}
  .setup-form input[type=text]{
    font-size:18px; padding:10px 14px; border-radius:12px; border:3px solid var(--accent); width:220px; font-family:inherit;
  }
  .avatar-picker{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:460px;}
  .avatar-choice{
    width:48px;height:48px; border-radius:50%; border:3px solid transparent; background:#fff;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
    transition:transform .15s, border-color .15s; font-size:26px; line-height:1;
  }
  .avatar-choice:hover{transform:scale(1.12);}
  .avatar-choice.selected{border-color:var(--accent); transform:scale(1.15); background:#efecff;}
  .players-list{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin:10px 0;}
  .player-chip{
    display:flex; align-items:center; gap:8px; background:#fff; border-radius:30px;
    padding:6px 14px 6px 6px; box-shadow:0 4px 10px rgba(0,0,0,0.15); border:3px solid var(--accent);
  }
  .player-chip .avatar-mini{font-size:26px; line-height:1;}
  .player-chip button{background:#ff4d4d22; color:#e2572b; box-shadow:none; padding:4px 8px; font-size:14px; border-radius:50%;}
  .start-actions{display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:10px;}

  /* scoreboard */
  .game-top{display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px; flex-wrap:wrap;}
  .scoreboard{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .score-chip{
    display:flex; align-items:center; gap:6px; background:#fff; border-radius:20px; padding:6px 12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12); border:3px solid transparent; font-weight:bold;
  }
  .score-chip.current-turn{border-color:var(--accent); background:#efecff; transform:scale(1.07);}
  .score-chip .avatar-mini{font-size:22px; line-height:1;}
  .score-chip .pts{color:#4834a8;}

  /* ---- Game screen ---- */
  .game-layout{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; width:100%;}
  .grid-wrap{background:#fff; border-radius:var(--radius); padding:12px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
  .grid{
    display:grid;
    grid-template-columns:repeat(10, minmax(26px, 36px));
    grid-template-rows:repeat(10, minmax(26px, 36px));
    gap:2px;
    user-select:none;
  }
  .cell{
    display:flex; align-items:center; justify-content:center;
    background:#f4f2ff; border-radius:6px; font-weight:bold;
    font-size:clamp(13px,2.4vw,17px); color:var(--text); cursor:pointer;
    transition:background .1s, transform .1s;
  }
  .cell:hover{background:#e4dfff;}
  .cell.selected{background:var(--accent2); color:#7a5c00;}
  .cell.found{background:#55efc4; color:#00664a;}
  .word-list-panel{
    background:var(--panel); border-radius:var(--radius); padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);
    min-width:220px; flex:1; max-width:280px;
  }
  .word-list-panel h2{margin-top:0; font-size:18px;}
  .word-item{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; font-weight:bold; margin-bottom:4px;
  }
  .word-item .emoji{font-size:22px;}
  .word-item.found{background:#d6fff0; color:#00664a; text-decoration:line-through; opacity:0.75;}
  .grid-shake{animation:shakeAnim .4s;}
  @keyframes shakeAnim{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }

  .confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;}
  .confetti span{position:absolute; top:-20px; font-size:24px; animation:fall linear forwards;}
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0.9;} }

  .winner-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none;
    align-items:center; justify-content:center; z-index:1000;
  }
  .winner-overlay.active{display:flex;}
  .winner-box{
    background:#fff; border-radius:24px; padding:30px 40px; text-align:center; max-width:90vw;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .winner-box h2{font-size:32px; color:var(--accent); margin-top:0;}
  .winner-box .avatar-mini{font-size:72px; line-height:1; margin:10px auto;}
  .footer-note{color:#fff; text-shadow:1px 1px 3px rgba(0,0,0,0.3); font-size:13px; margin-top:20px; text-align:center;}
  @media (max-width:480px){
    .setup-form input[type=text]{width:160px;}
    .grid{grid-template-columns:repeat(10, minmax(22px, 30px)); grid-template-rows:repeat(10, minmax(22px, 30px));}
  }
</style>
</head>
<body>

<a class="back-link" href="../index.html">← Outros jogos</a>
<h1>🔍 Caça-Palavras 🔍</h1>
<p class="subtitle">Encontre as palavras escondidas na grade!</p>

<!-- SETUP SCREEN -->
<div id="setup-screen" class="screen active">
  <div class="panel">
    <h2>👧🧒 Jogadores</h2>
    <div class="setup-form">
      <input type="text" id="player-name" placeholder="Nome do jogador" maxlength="14">
    </div>
    <div class="avatar-picker" id="avatar-picker"></div>
    <div class="start-actions">
      <button class="secondary" id="add-player-btn">➕ Adicionar jogador</button>
    </div>
    <div class="players-list" id="players-list"></div>
  </div>

  <div class="start-actions">
    <button id="start-game-btn" disabled>🚀 Começar o jogo!</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen">
  <div class="game-top">
    <div class="scoreboard" id="scoreboard"></div>
    <button class="secondary" id="restart-btn">🔄 Novo jogo</button>
  </div>

  <div class="game-layout">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
    </div>
    <div class="word-list-panel">
      <h2>🔎 Encontre:</h2>
      <div id="word-list"></div>
    </div>
  </div>
</div>

<div class="winner-overlay" id="winner-overlay">
  <div class="winner-box">
    <h2 id="winner-title">🏆 Vencedor! 🏆</h2>
    <div id="winner-avatar"></div>
    <p id="winner-text" style="font-size:20px;font-weight:bold;"></p>
    <button id="play-again-btn">🎮 Jogar de novo</button>
  </div>
</div>

<p class="footer-note">Feito com 💖 para pequenos detetives</p>

<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
