<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Labirinto Maluco 🌀</title>
<link rel="icon" href="../assets/favicon.ico">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  :root{
    --bg1:#a1c4fd;
    --bg2:#c2e9fb;
    --panel:#ffffffee;
    --text:#2d2d4d;
    --accent:#7b61ff;
    --accent2:#ffb347;
    --wall:#4b3f72;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Comic Sans MS', 'Trebuchet MS', Arial, sans-serif;
    background:linear-gradient(135deg,#a1c4fd 0%,#c2e9fb 30%,#fbc2eb 60%,#fcefb4 100%);
    background-size:400% 400%;
    animation:bgMove 18s ease infinite;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .back-link{
    align-self:flex-start;
    color:#fff;
    font-weight:bold;
    text-decoration:none;
    text-shadow:1px 1px 3px rgba(0,0,0,0.25);
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(28px,6vw,46px);
    text-align:center;
    color:#fff;
    text-shadow:3px 3px 0 var(--accent), -1px -1px 0 #fff2;
    margin:10px 0 4px;
    letter-spacing:1px;
  }
  .subtitle{
    text-align:center;
    color:#fff;
    font-weight:bold;
    text-shadow:1px 1px 3px rgba(0,0,0,0.25);
    margin-bottom:16px;
  }
  .screen{
    width:100%;
    max-width:700px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .screen.active{display:flex;}
  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    width:100%;
  }

  /* ---- Setup screen ---- */
  .setup-form{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
  }
  .setup-form input[type=text]{
    font-size:18px;
    padding:10px 14px;
    border-radius:12px;
    border:3px solid var(--accent2);
    width:220px;
    font-family:inherit;
  }
  .avatar-picker{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    max-width:460px;
  }
  .avatar-choice{
    width:48px;height:48px;
    border-radius:50%;
    border:3px solid transparent;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s, border-color .15s;
    font-size:26px;
    line-height:1;
  }
  .avatar-choice:hover{transform:scale(1.12);}
  .avatar-choice.selected{border-color:var(--accent); transform:scale(1.15); background:#f1edff;}

  button{
    font-family:inherit;
    font-size:18px;
    font-weight:bold;
    padding:12px 22px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,var(--accent),#9d8bff);
    box-shadow:0 6px 0 #4d3bb0, 0 10px 18px rgba(0,0,0,0.2);
    transition:transform .08s;
  }
  button:active{transform:translateY(4px); box-shadow:0 2px 0 #4d3bb0;}
  button.secondary{
    background:linear-gradient(135deg,var(--accent2),#ffd27a);
    box-shadow:0 6px 0 #c9820a, 0 10px 18px rgba(0,0,0,0.2);
  }
  button.secondary:active{box-shadow:0 2px 0 #c9820a;}
  button:disabled{opacity:.5; cursor:not-allowed; box-shadow:none;}

  .players-list{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin:10px 0;
  }
  .player-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff;
    border-radius:30px;
    padding:6px 14px 6px 6px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    border:3px solid var(--accent2);
  }
  .player-chip .avatar-mini{font-size:26px; line-height:1;}
  .player-chip button{
    background:#ff4d4d22;
    color:#e2572b;
    box-shadow:none;
    padding:4px 8px;
    font-size:14px;
    border-radius:50%;
  }
  .size-options{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .size-chip{
    padding:8px 16px;
    border-radius:20px;
    background:#fff;
    border:3px solid #ddd;
    cursor:pointer;
    font-weight:bold;
  }
  .size-chip.selected{
    border-color:var(--accent);
    background:#f1edff;
    color:var(--accent);
  }
  .start-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:10px;
  }

  /* ---- Game screen ---- */
  .game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    gap:10px;
    flex-wrap:wrap;
  }
  .scoreboard{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .score-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border-radius:20px;
    padding:6px 12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    border:3px solid transparent;
    font-weight:bold;
  }
  .score-chip.current-turn{
    border-color:var(--accent);
    background:#f1edff;
    transform:scale(1.07);
  }
  .score-chip .avatar-mini{font-size:22px; line-height:1;}

  .maze-wrap{
    position:relative;
    width:100%;
    max-width:520px;
    margin:10px auto;
  }
  .maze{
    position:relative;
    display:grid;
    width:100%;
    aspect-ratio:1/1;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,0.2);
    overflow:hidden;
  }
  .maze.shake{ animation:mazeShake .35s; }
  @keyframes mazeShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .maze-cell{
    position:relative;
    box-sizing:border-box;
  }
  .maze-cell .mark{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:min(3.5vw, 20px);
    opacity:0.85;
    pointer-events:none;
  }
  .token-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .token{
    position:absolute;
    width:7%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--accent);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    transform:translate(-50%,-50%);
    transition:left .25s ease, top .25s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:min(3vw, 16px);
  }

  .controls{
    display:grid;
    grid-template-columns:60px 60px 60px;
    grid-template-rows:60px 60px 60px;
    gap:6px;
    justify-content:center;
    margin:14px auto 0;
  }
  .controls button{
    padding:0;
    width:60px;
    height:60px;
    font-size:24px;
    border-radius:16px;
  }
  .ctrl-up{grid-column:2; grid-row:1;}
  .ctrl-left{grid-column:1; grid-row:2;}
  .ctrl-right{grid-column:3; grid-row:2;}
  .ctrl-down{grid-column:2; grid-row:3;}

  .confetti{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:999;
  }
  .confetti span{
    position:absolute;
    top:-20px;
    font-size:24px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0.9;}
  }

  .winner-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  .winner-overlay.active{display:flex;}
  .winner-box{
    background:#fff;
    border-radius:24px;
    padding:30px 40px;
    text-align:center;
    max-width:90vw;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  .winner-box h2{font-size:32px;color:var(--accent);margin-top:0;}
  .winner-box .avatar-mini{font-size:72px;line-height:1;margin:10px auto;}
  .footer-note{
    color:#fff;
    text-shadow:1px 1px 3px rgba(0,0,0,0.3);
    font-size:13px;
    margin-top:20px;
    text-align:center;
  }
  @media (max-width:480px){
    .setup-form input[type=text]{width:160px;}
  }
</style>
</head>
<body>

<a class="back-link" href="../index.html">← Outros jogos</a>
<h1>🌀 Labirinto Maluco 🌀</h1>
<p class="subtitle">Seja o primeiro a chegar até o troféu!</p>

<!-- SETUP SCREEN -->
<div id="setup-screen" class="screen active">
  <div class="panel">
    <h2>👧🧒 Jogadores</h2>
    <div class="setup-form">
      <input type="text" id="player-name" placeholder="Nome do jogador" maxlength="14">
    </div>
    <div class="avatar-picker" id="avatar-picker"></div>
    <div class="start-actions">
      <button class="secondary" id="add-player-btn">➕ Adicionar jogador</button>
    </div>
    <div class="players-list" id="players-list"></div>
  </div>

  <div class="panel">
    <h2>🧭 Tamanho do labirinto</h2>
    <div class="size-options" id="size-options"></div>
  </div>

  <div class="start-actions">
    <button id="start-game-btn" disabled>🚀 Começar o jogo!</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen">
  <div class="game-top">
    <div class="scoreboard" id="scoreboard"></div>
    <div>
      <button class="secondary" id="restart-btn">🔄 Novo jogo</button>
    </div>
  </div>

  <div class="maze-wrap">
    <div class="maze" id="maze"></div>
    <div class="token-layer" id="token-layer"></div>
  </div>

  <div class="controls">
    <button class="ctrl-up" id="ctrl-up" aria-label="Mover para cima">⬆️</button>
    <button class="ctrl-left" id="ctrl-left" aria-label="Mover para esquerda">⬅️</button>
    <button class="ctrl-right" id="ctrl-right" aria-label="Mover para direita">➡️</button>
    <button class="ctrl-down" id="ctrl-down" aria-label="Mover para baixo">⬇️</button>
  </div>
</div>

<div class="winner-overlay" id="winner-overlay">
  <div class="winner-box">
    <h2 id="winner-title">🏆 Vencedor! 🏆</h2>
    <div id="winner-avatar"></div>
    <p id="winner-text" style="font-size:20px;font-weight:bold;"></p>
    <button id="play-again-btn">🎮 Jogar de novo</button>
  </div>
</div>

<p class="footer-note">Feito com 💖 para crianças curiosas</p>

<script src="game.js"></script>
</body>
</html>
